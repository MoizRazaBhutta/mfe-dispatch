<div class="p-6 bg-slate-900 min-h-screen text-white">
      <div class="mb-6 flex items-center justify-between border-b border-slate-800 pb-4">
        <div>
          <span class="bg-indigo-600 text-xs font-bold px-2.5 py-1 rounded-full text-white uppercase tracking-wider">
            MFE 2: DISPATCH WORKSPACE
          </span>
          <h2 class="text-2xl font-bold mt-2">Active Dispatch Control</h2>
        </div>

        <!-- Handshake Session Badge received from Shell -->
        <div *ngIf="session" class="text-right text-xs bg-slate-800 px-3 py-2 rounded-lg border border-slate-700">
          <p class="text-slate-400">Handshake Auth</p>
          <p class="font-mono text-emerald-400 font-bold">{{ session.name }} ({{ session.role }})</p>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Active Dispatch List -->
        <div class="lg:col-span-2 bg-slate-800/50 p-4 rounded-xl border border-slate-800">
          <h3 class="font-bold text-sm mb-4 text-slate-300 uppercase tracking-wide">Active Fleet Jobs</h3>
          <div class="space-y-3">
            <div class="p-3 bg-slate-800 rounded-lg border border-slate-700 flex justify-between items-center text-sm">
              <div>
                <p class="font-bold">JOB-2049: Express Logistics</p>
                <p class="text-xs text-slate-400">Route: North York ➔ Downtown Toronto</p>
              </div>
              <span class="text-xs px-2 py-1 bg-amber-500/10 text-amber-400 rounded border border-amber-500/20">In Progress</span>
            </div>
          </div>
        </div>

        <!-- Cross-MFE Embedded Parcel from MFE 1 -->
        <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-800">
          <h3 class="font-bold text-sm mb-4 text-slate-300 uppercase tracking-wide">
            Assigned Driver (Cross-MFE Parcel)
          </h3>
          <!-- DOM Target for DriverBadgeParcel -->
          <div #parcelContainer></div>
        </div>
      </div>
    </div>
